<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Designer Code Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        #file-path-bar {
            padding: 3px 12px;
            background: var(--bar-bg, rgba(128,128,128,0.1));
            color: var(--bar-fg, rgba(128,128,128,0.8));
            font-size: 12px;
            font-family: Consolas, 'Courier New', monospace;
            border-bottom: 1px solid var(--bar-border, rgba(128,128,128,0.15));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
            flex-shrink: 0;
        }
        #gopls-status-bar {
            display: none;
            flex-shrink: 0;
            padding: 4px 12px;
            background: #5a1f1f;
            color: #ffd0d0;
            font-size: 12px;
            font-family: Consolas, 'Courier New', monospace;
            border-bottom: 1px solid #8a3030;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #gopls-status-bar.show { display: block; }
        #conflict-bar {
            display: none;
            flex-shrink: 0;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: #5a3a00;
            color: #ffe0a0;
            font-size: 12px;
            font-family: Consolas, 'Courier New', monospace;
            border-bottom: 1px solid #8a6000;
        }
        #conflict-bar.show { display: flex; }
        #conflict-message {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        #conflict-bar button {
            flex-shrink: 0;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            padding: 3px 10px;
            background: rgba(255,255,255,0.12);
            color: inherit;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 3px;
        }
        #conflict-bar button:hover { background: rgba(255,255,255,0.25); }
        #container { flex: 1; min-height: 0; }
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 10px 20px; background: #2d2d2d; color: #e0e0e0;
            border-left: 3px solid #4fc3f7; border-radius: 4px; font-size: 13px;
            z-index: 1000; opacity: 0; transform: translateX(100%);
            transition: all 0.3s ease; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
    </style>
</head>
<body>
<div id="file-path-bar"></div>
<div id="gopls-status-bar"></div>
<div id="conflict-bar">
    <span id="conflict-message"></span>
    <button id="conflict-reload" type="button">重新加载（放弃我的修改）</button>
    <button id="conflict-keep" type="button">保留我的修改</button>
</div>
<div id="container"></div>
<div id="toast" class="toast"></div>

<script src="./vs/loader.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/editor.js"></script>
<script src="./js/pls_bridge.js"></script>
<script src="./js/file_manager.js"></script>
<script src="./js/ipc_handlers.js"></script>
</body>
</html>
