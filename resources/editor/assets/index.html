<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Designer Code Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        #file-path-bar {
            padding: 3px 12px;
            background: var(--bar-bg, rgba(128,128,128,0.1));
            color: var(--bar-fg, rgba(128,128,128,0.8));
            font-size: 12px;
            font-family: Consolas, 'Courier New', monospace;
            border-bottom: 1px solid var(--bar-border, rgba(128,128,128,0.15));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
            flex-shrink: 0;
        }
        #container { flex: 1; min-height: 0; }
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 10px 20px; background: #2d2d2d; color: #e0e0e0;
            border-left: 3px solid #4fc3f7; border-radius: 4px; font-size: 13px;
            z-index: 1000; opacity: 0; transform: translateX(100%);
            transition: all 0.3s ease; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
    </style>
</head>
<body>
<div id="file-path-bar"></div>
<div id="container"></div>
<div id="toast" class="toast"></div>

<script src="./vs/loader.js"></script>
<script src="./utils.js"></script>
<script src="./editor.js"></script>
<script src="./lsp_bridge.js"></script>
<script src="./file_manager.js"></script>
<script src="./ipc_handlers.js"></script>
</body>
</html>
