<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Designer Code Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        #container {
            flex: 1;
            min-height: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>

<script src="./vs/loader.js"></script>
<script>
    let editor = null;
    const models = new Map();
    let currentFilePath = '';
    let saveTimeout = null;
    const fileStates = new Map();

    require.config({ paths: { vs: './vs' } });
    require(['vs/editor/editor.main'], function(monaco) {
        editor = monaco.editor.create(document.getElementById('container'), {
            value: '',
            language: 'go',
            theme: 'vs-dark',
            fontSize: 14,
            automaticLayout: true,
            minimap: { enabled: true },
            scrollBeyondLastLine: false,
            renderWhitespace: 'selection',
            tabSize: 4,
            insertSpaces: true
        });

        editor.onDidChangeModelContent(() => {
            markCurrentFileDirty();
            
            if (saveTimeout) {
                clearTimeout(saveTimeout);
            }
            saveTimeout = setTimeout(() => {
                autoSaveCurrentFile();
            }, 500);
        });

        ipc.emit("monaco-inited", []);
    });

    function markCurrentFileDirty() {
        if (currentFilePath && fileStates.has(currentFilePath)) {
            const state = fileStates.get(currentFilePath);
            if (!state.isDirty) {
                state.isDirty = true;
                ipc.emit('set-file-dirty', [{
                    file: currentFilePath,
                    isDirty: true
                }]);
            }
        }
    }

    function autoSaveCurrentFile() {
        if (!currentFilePath || !editor) {
            return;
        }

        const model = editor.getModel();
        if (!model) {
            return;
        }

        const content = model.getValue();
        ipc.emit('save-file', [{
            file: currentFilePath,
            content: content
        }], function(result) {
            if (result === 'ok') {
                if (fileStates.has(currentFilePath)) {
                    fileStates.get(currentFilePath).isDirty = false;
                }
            }
        });
    }

    function openFile(filePath) {
        if (!editor) {
            return;
        }

        ipc.emit('open-file-request', [filePath], function(response) {
            if (!response) {
                console.error('打开文件失败:', filePath);
                return;
            }

            const fileInfo = JSON.parse(response);
            const content = fileInfo.content;
            const language = fileInfo.language;
            const modTime = fileInfo.modTime;
            console.log("open-file-request:", fileInfo)
            if (models.has(filePath)) {
                const modelInfo = models.get(filePath);
                
                if (modelInfo.modTime !== modTime && !modelInfo.isDirty) {
                    const fileName = getFileName(filePath);
                    const result = confirm('文件 "' + fileName + '" 已被外部修改，是否重新加载？');
                    if (result) {
                        modelInfo.model.setValue(content);
                        modelInfo.modTime = modTime;
                        modelInfo.isDirty = false;
                    }
                }
                
                monaco.editor.setModel(modelInfo.model);
            } else {
                const uri = monaco.Uri.parse('file:///' + filePath.replace(/\\/g, '/'));
                const model = monaco.editor.createModel(content, language, uri);
                models.set(filePath, {
                    model: model,
                    modTime: modTime,
                    isDirty: false
                });
                fileStates.set(filePath, {
                    isDirty: false,
                    modTime: modTime
                });
                monaco.editor.setModel(model);
                
                ipc.emit('register-opened-file', [{
                    file: filePath,
                    modTime: modTime
                }]);
            }

            currentFilePath = filePath;
        });
    }

    function closeFile(filePath) {
        if (models.has(filePath)) {
            const modelInfo = models.get(filePath);
            
            if (modelInfo.isDirty) {
                const fileName = getFileName(filePath);
                const result = confirm('文件 "' + fileName + '" 有未保存的修改，是否保存？');
                if (result) {
                    const content = modelInfo.model.getValue();
                    ipc.emit('save-file', [{
                        file: filePath,
                        content: content
                    }]);
                }
            }
            
            modelInfo.model.dispose();
            models.delete(filePath);
            fileStates.delete(filePath);
            
            ipc.emit('unregister-opened-file', [filePath]);
            
            if (currentFilePath === filePath) {
                currentFilePath = '';
                if (models.size > 0) {
                    const firstKey = models.keys().next().value;
                    const firstModel = models.get(firstKey);
                    monaco.editor.setModel(firstModel);
                    currentFilePath = firstKey;
                } else {
                    const emptyModel = monaco.editor.createModel('', 'plaintext');
                    monaco.editor.setModel(emptyModel);
                }
            }
        }
    }

    ipc.on('open-file', function(data) {
        const filePath = data;
        console.log("open-file", data)
        openFile(filePath);
    });

    ipc.on('close-file', function(data) {
        const filePath = data;
        closeFile(filePath);
    });

    ipc.on('save-current-file', function() {
        autoSaveCurrentFile();
    });

    ipc.on('file-changed-externally', function(filePath) {
        if (models.has(filePath)) {
            const modelInfo = models.get(filePath);
            
            if (!modelInfo.isDirty) {
                ipc.emit('reload-file-request', [filePath], function(response) {
                    if (response) {
                        const fileInfo = JSON.parse(response);
                        modelInfo.model.setValue(fileInfo.content);
                        modelInfo.modTime = fileInfo.modTime;
                        
                        if (currentFilePath === filePath) {
                            monaco.editor.setModel(modelInfo.model);
                        }
                        
                        showNotification('文件已重新加载: ' + getFileName(filePath));
                    }
                });
            }
        }
    });

    ipc.on('file-conflict-detected', function(filePath) {
        if (models.has(filePath)) {
            const fileName = getFileName(filePath);
            const result = confirm('文件 "' + fileName + '" 存在冲突！\n\n编辑器中有未保存的修改，但文件也被外部修改。\n\n是否重新加载外部修改？（这将丢失编辑器的修改）');
            if (result) {
                ipc.emit('reload-file-request', [filePath], function(response) {
                    if (response) {
                        const fileInfo = JSON.parse(response);
                        const modelInfo = models.get(filePath);
                        modelInfo.model.setValue(fileInfo.content);
                        modelInfo.modTime = fileInfo.modTime;
                        modelInfo.isDirty = false;
                        
                        if (currentFilePath === filePath) {
                            monaco.editor.setModel(modelInfo.model);
                        }
                    }
                });
            }
        }
    });

    function getFileName(filePath) {
        const parts = filePath.replace(/\\/g, '/').split('/');
        return parts[parts.length - 1];
    }

    function showNotification(message) {
        console.log('[Notification]', message);
    }

</script>
</body>
</html>
