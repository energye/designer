<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Designer Code Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        #container { flex: 1; min-height: 0; }
        .toast {
            position: fixed; top: 20px; right: 20px;
            padding: 10px 20px; background: #2d2d2d; color: #e0e0e0;
            border-left: 3px solid #4fc3f7; border-radius: 4px; font-size: 13px;
            z-index: 1000; opacity: 0; transform: translateX(100%);
            transition: all 0.3s ease; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
    </style>
</head>
<body>
<div id="container"></div>
<div id="toast" class="toast"></div>

<script src="./vs/loader.js"></script>
<script>
// ============================================================
// Section 5: UTILITIES - Helper functions
// ============================================================

function lspKindToMonaco(kind, K) {
    switch (kind) {
        case 1: return K.Text; case 2: return K.Method; case 3: return K.Function;
        case 4: return K.Constructor; case 5: return K.Field; case 6: return K.Variable;
        case 7: return K.Class; case 8: return K.Interface; case 9: return K.Module;
        case 10: return K.Property; case 11: return K.Unit; case 12: return K.Value;
        case 13: return K.Enum; case 14: return K.Keyword; case 15: return K.Snippet;
        case 16: return K.Color; case 17: return K.File; case 18: return K.Reference;
        case 19: return K.Folder; case 20: return K.EnumMember; case 21: return K.Constant;
        case 22: return K.Struct; case 23: return K.Event; case 24: return K.Operator;
        case 25: return K.TypeParameter; default: return K.Text;
    }
}

function diagSeverityToMonaco(severity) {
    var S = monacoRef.MarkerSeverity;
    switch (severity) {
        case 1: return S.Error; case 2: return S.Warning;
        case 3: return S.Info; case 4: return S.Hint;
        default: return S.Error;
    }
}

function getFilePathByModel(model) {
    for (var _ref = files.entries(), _pair = _ref.next(); !_pair.done; _pair = _ref.next()) {
        var _entry = _pair.value;
        if (_entry[1].model === model) return _entry[0];
    }
    return null;
}

function getModelByFilePath(filePath) {
    var info = files.get(filePath);
    return info ? info.model : null;
}

function getFileName(filePath) {
    return filePath.replace(/\\/g, '/').split('/').pop();
}

function showNotification(message) {
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 3000);
}

// ============================================================
// Section 1: EDITOR ADAPTER - Monaco-specific initialization
// ============================================================

var editor = null;
var monacoRef = null;
var currentFilePath = '';
var saveTimeout = null;
var applyingEdit = false;
var organizeImportsTimeout = null;
var pendingOrganizeSave = null;
var saveAfterOrganizeTimeout = null;
var files = new Map();
var currentDiagnostics = new Map();

var EditorAdapter = {
    name: 'monaco',

    createEditor: function (container, options) {
        return monacoRef.editor.create(container, options);
    },

    getActiveModel: function () {
        return editor.getModel();
    },

    setModel: function (model) {
        editor.setModel(model);
    },

    saveViewState: function () {
        return editor.saveViewState();
    },

    restoreViewState: function (state) {
        editor.restoreViewState(state);
    },

    updateOptions: function (opts) {
        editor.updateOptions(opts);
    },

    onContentChange: function (callback) {
        editor.onDidChangeModelContent(callback);
    },

    createModel: function (content, language, uri) {
        return monacoRef.editor.createModel(content, language, uri);
    },

    disposeModel: function (model) {
        model.dispose();
    },

    applyEdits: function (model, edits) {
        model.applyEdits(edits);
    },

    getFullModelRange: function (model) {
        return model.getFullModelRange();
    },

    setModelMarkers: function (model, owner, markers) {
        monacoRef.editor.setModelMarkers(model, owner, markers);
    },

    uri: function (path) {
        return monacoRef.Uri.parse('file:///' + path.replace(/\\/g, '/'));
    }
};

require.config({paths: {vs: './vs'}});
require(['vs/editor/editor.main'], function (monaco) {
    monacoRef = monaco;

    editor = EditorAdapter.createEditor(document.getElementById('container'), {
        value: '', language: 'go', theme: 'vs-dark', fontSize: 14,
        automaticLayout: true, minimap: {enabled: true},
        scrollBeyondLastLine: false, renderWhitespace: 'selection',
        tabSize: 4, insertSpaces: true,
        quickSuggestions: {other: true, comments: false, strings: false},
        suggestOnTriggerCharacters: true, acceptSuggestionOnEnter: 'on',
        wordBasedSuggestions: 'currentDocument',
        suggest: {showMethods: true, showFunctions: true, showFields: true, showVariables: true, showWords: true},
        parameterHints: {enabled: true}
    });

    // === Register LSP providers ===
    registerLSPProviders();

    // === Content Change ===
    EditorAdapter.onContentChange(function () {
        if (applyingEdit) return;

        var changedFilePath = null;
        for (var _ref = files.entries(), _pair = _ref.next(); !_pair.done; _pair = _ref.next()) {
            var _entry = _pair.value;
            if (_entry[1].model === EditorAdapter.getActiveModel()) {
                changedFilePath = _entry[0];
                break;
            }
        }

        if (changedFilePath && files.has(changedFilePath)) {
            var info = files.get(changedFilePath);
            if (!info.isDirty) {
                info.isDirty = true;
                ipc.emit('set-file-dirty', [{file: changedFilePath, isDirty: true}]);
            }
            info.version++;
            ipc.emit('gopls-didChange', [{
                file: changedFilePath,
                content: info.model.getValue(),
                version: info.version
            }]);
        }
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(autoSave, 500);
    });

    ipc.emit("monaco-inited", []);
});

// ============================================================
// Section 2: LSP BRIDGE - Go <-> JS LSP communication
// ============================================================

var completionRequestID = 0;
var pendingCompletion = null;
var signatureHelpRequestID = 0;
var pendingSignatureHelp = null;
var codeActionRequestID = 0;
var pendingCodeAction = null;

function registerLSPProviders() {
    // === Completion provider ===
    monacoRef.languages.registerCompletionItemProvider('go', {
        triggerCharacters: ['.', '(', '"', "'", '/', '@'],
        provideCompletionItems: function (model, position, token, context) {
            var filePath = getFilePathByModel(model);
            if (!filePath) return {suggestions: []};

            var line = position.lineNumber - 1;
            var column = position.column - 1;
            completionRequestID++;
            var reqID = completionRequestID;

            var triggerKind = 1;
            var triggerChar = '';
            if (context && context.triggerKind === 2) {
                triggerKind = 2;
                triggerChar = context.triggerCharacter || '';
            } else if (context && context.triggerKind === 3) {
                triggerKind = 3;
                triggerChar = context.triggerCharacter || '';
            }

            return new Promise(function (resolve) {
                pendingCompletion = {reqID: reqID, resolve: resolve};
                setTimeout(function () {
                    if (pendingCompletion && pendingCompletion.reqID === reqID) {
                        pendingCompletion = null;
                        resolve({suggestions: []});
                    }
                }, 3000);

                ipc.emit('gopls-completion', [{
                    requestID: reqID, file: filePath, line: line, column: column,
                    triggerKind: triggerKind, triggerChar: triggerChar
                }]);
            });
        }
    });

    // === Signature Help provider ===
    monacoRef.languages.registerSignatureHelpProvider('go', {
        signatureHelpTriggerCharacters: ['(', ','],
        provideSignatureHelp: function (model, position, token, context) {
            var filePath = getFilePathByModel(model);
            if (!filePath) return null;

            var line = position.lineNumber - 1;
            var column = position.column - 1;
            signatureHelpRequestID++;
            var reqID = signatureHelpRequestID;

            return new Promise(function (resolve) {
                pendingSignatureHelp = {reqID: reqID, resolve: resolve};
                setTimeout(function () {
                    if (pendingSignatureHelp && pendingSignatureHelp.reqID === reqID) {
                        pendingSignatureHelp = null;
                        resolve(null);
                    }
                }, 3000);

                ipc.emit('gopls-signatureHelp', [{
                    requestID: reqID, file: filePath, line: line, column: column
                }]);
            });
        }
    });

    // === Code Action provider ===
    monacoRef.languages.registerCodeActionProvider('go', {
        provideCodeActions: function (model, range, context) {
            var filePath = getFilePathByModel(model);
            if (!filePath) return {actions: [], dispose: function(){}};

            codeActionRequestID++;
            var reqID = codeActionRequestID;

            var kinds = 'quickfix,source.organizeImports';
            var diags = currentDiagnostics.get(filePath) || [];
            var rangeDiags = diags.filter(function (d) {
                var dStartLine = (d.range && d.range.start ? d.range.start.line + 1 : 1);
                var dEndLine = (d.range && d.range.end ? d.range.end.line + 1 : 1);
                return dEndLine >= range.startLineNumber && dStartLine <= range.endLineNumber;
            });

            return new Promise(function (resolve) {
                pendingCodeAction = {reqID: reqID, resolve: resolve};
                setTimeout(function () {
                    if (pendingCodeAction && pendingCodeAction.reqID === reqID) {
                        pendingCodeAction = null;
                        resolve({actions: [], dispose: function(){}});
                    }
                }, 3000);

                ipc.emit('gopls-codeAction', [{
                    requestID: reqID, file: filePath,
                    startLine: range.startLineNumber - 1, startChar: range.startColumn - 1,
                    endLine: range.endLineNumber - 1, endChar: range.endColumn - 1,
                    kinds: kinds, diagnostics: rangeDiags
                }]);
            });
        }
    });
}

// === Completion Response Handler ===
ipc.on('gopls-completion-response', function (reqID, resultJSON) {
    if (!pendingCompletion || pendingCompletion.reqID !== reqID) return;

    var resolve = pendingCompletion.resolve;
    pendingCompletion = null;

    var items = [];
    try {
        var parsed = JSON.parse(resultJSON);
        if (Array.isArray(parsed)) {
            items = parsed;
        }
    } catch (e) {}

    var K = monacoRef.languages.CompletionItemKind;
    var Snippet = monacoRef.languages.CompletionItemInsertTextRule;
    var suggestions = items.map(function (item) {
        var s = {
            label: item.label,
            kind: lspKindToMonaco(item.kind, K),
            detail: item.detail || '',
            documentation: item.documentation || '',
            insertText: item.insertText || item.label,
            sortText: item.sortText || item.label,
            filterText: item.filterText || item.label
        };
        if (item.insertTextFormat === 2) {
            s.insertTextRules = Snippet.InsertAsSnippet;
        }
        if (item.deprecated) {
            s.tags = [monacoRef.languages.CompletionItemTag.Deprecated];
        }
        if (item.additionalTextEdits && item.additionalTextEdits.length > 0) {
            s.additionalTextEdits = item.additionalTextEdits.map(function (edit) {
                return {
                    range: {
                        startLineNumber: edit.range.start.line + 1,
                        startColumn: edit.range.start.character + 1,
                        endLineNumber: edit.range.end.line + 1,
                        endColumn: edit.range.end.character + 1
                    },
                    text: edit.newText
                };
            });
        }
        return s;
    });

    resolve({suggestions: suggestions});
});

// === Signature Help Response Handler ===
ipc.on('gopls-signatureHelp-response', function (reqID, resultJSON) {
    if (!pendingSignatureHelp || pendingSignatureHelp.reqID !== reqID) return;

    var resolve = pendingSignatureHelp.resolve;
    pendingSignatureHelp = null;

    if (!resultJSON) { resolve(null); return; }

    var data = null;
    try { data = JSON.parse(resultJSON); } catch (e) { resolve(null); return; }

    if (!data.signatures || data.signatures.length === 0) { resolve(null); return; }

    var signatures = data.signatures.map(function (sig) {
        return {
            label: sig.label,
            documentation: sig.documentation || '',
            parameters: (sig.parameters || []).map(function (p) {
                return { label: p.label, documentation: p.documentation || '' };
            })
        };
    });

    resolve({
        value: {
            signatures: signatures,
            activeSignature: data.activeSignature >= 0 ? data.activeSignature : 0,
            activeParameter: data.activeParameter >= 0 ? data.activeParameter : 0
        },
        dispose: function () {}
    });
});

// === Code Action Response Handler ===
ipc.on('gopls-codeAction-response', function (reqID, resultJSON) {
    var actions = [];
    try { actions = JSON.parse(resultJSON); } catch (e) {}
    if (!Array.isArray(actions)) actions = [];

    var isAutoOrganize = (!pendingCodeAction || pendingCodeAction.reqID !== reqID);

    if (isAutoOrganize) {
        actions.forEach(function (action) {
            if (action.kind === 'source.organizeImports' && action.edit && action.edit.changes) {
                applyWorkspaceEdit(action.edit);
            }
        });
        if (pendingOrganizeSave && pendingOrganizeSave.reqID === reqID) {
            clearTimeout(saveAfterOrganizeTimeout);
            saveAfterOrganizeTimeout = setTimeout(function () {
                var fp = pendingOrganizeSave.filePath;
                pendingOrganizeSave = null;
                if (fp && files.has(fp)) {
                    var model = getModelByFilePath(fp);
                    if (model) {
                        ipc.emit('save-file', [{file: fp, content: model.getValue()}], function (result) {
                            if (result === 'ok') {
                                files.get(fp).isDirty = false;
                            }
                        });
                    }
                }
            }, 100);
        }
        return;
    }

    var resolve = pendingCodeAction.resolve;
    pendingCodeAction = null;

    if (!Array.isArray(actions)) { resolve({actions: [], dispose: function(){}}); return; }

    var codeActions = actions.map(function (action) {
        var ca = {
            title: action.title,
            kind: action.kind || 'quickfix',
            diagnostics: [],
            edit: { edits: [] }
        };

        if (action.edit && action.edit.changes) {
            var allEdits = [];
            for (var filePath in action.edit.changes) {
                if (!action.edit.changes.hasOwnProperty(filePath)) continue;
                var edits = action.edit.changes[filePath];
                var model = getModelByFilePath(filePath);
                if (!model) continue;
                for (var i = 0; i < edits.length; i++) {
                    var edit = edits[i];
                    allEdits.push({
                        resource: model.uri,
                        edit: {
                            range: {
                                startLineNumber: edit.range.start.line + 1,
                                startColumn: edit.range.start.character + 1,
                                endLineNumber: edit.range.end.line + 1,
                                endColumn: edit.range.end.character + 1
                            },
                            text: edit.newText
                        }
                    });
                }
            }
            ca.edit.edits = allEdits;
        }

        return ca;
    });

    resolve({actions: codeActions, dispose: function(){}});
});

// === Diagnostics Handler ===
ipc.on('gopls-diagnostics', function (filePath, diagnosticsJSON) {
    if (!monacoRef) return;
    var model = getModelByFilePath(filePath);
    if (!model) return;

    var diags = [];
    try { diags = JSON.parse(diagnosticsJSON); } catch (e) { return; }
    if (!Array.isArray(diags)) return;

    currentDiagnostics.set(filePath, diags);

    var markers = diags.map(function (d) {
        return {
            severity: diagSeverityToMonaco(d.severity),
            message: d.message,
            startLineNumber: (d.range && d.range.start ? d.range.start.line + 1 : 1),
            startColumn: (d.range && d.range.start ? d.range.start.character + 1 : 1),
            endLineNumber: (d.range && d.range.end ? d.range.end.line + 1 : 1),
            endColumn: (d.range && d.range.end ? d.range.end.character + 1 : 1)
        };
    });

    EditorAdapter.setModelMarkers(model, 'gopls', markers);

    var hasUnusedImport = diags.some(function (d) {
        return d.message && d.message.indexOf('imported and not used') >= 0;
    });
    if (hasUnusedImport && filePath === currentFilePath) {
        autoOrganizeImports(filePath, model);
    }
});

function autoOrganizeImports(filePath, model) {
    clearTimeout(organizeImportsTimeout);
    organizeImportsTimeout = setTimeout(function () {
        codeActionRequestID++;
        var reqID = codeActionRequestID;
        var kinds = 'source.organizeImports';
        var diags = currentDiagnostics.get(filePath) || [];
        var fullRange = EditorAdapter.getFullModelRange(model);

        ipc.emit('gopls-codeAction', [{
            requestID: reqID, file: filePath,
            startLine: fullRange.startLineNumber - 1, startChar: fullRange.startColumn - 1,
            endLine: fullRange.endLineNumber - 1, endChar: fullRange.endColumn - 1,
            kinds: kinds, diagnostics: diags
        }]);
    }, 800);
}

function applyWorkspaceEdit(workspaceEdit) {
    if (!workspaceEdit || !workspaceEdit.changes) return;
    applyingEdit = true;
    try {
        for (var filePath in workspaceEdit.changes) {
            if (!workspaceEdit.changes.hasOwnProperty(filePath)) continue;
            var edits = workspaceEdit.changes[filePath];
            var model = getModelByFilePath(filePath);
            if (!model) continue;
            var monacoEdits = edits.slice().reverse().map(function (edit) {
                return {
                    range: {
                        startLineNumber: edit.range.start.line + 1,
                        startColumn: edit.range.start.character + 1,
                        endLineNumber: edit.range.end.line + 1,
                        endColumn: edit.range.end.character + 1
                    },
                    text: edit.newText
                };
            });
            EditorAdapter.applyEdits(model, monacoEdits);
        }
    } finally {
        applyingEdit = false;
        for (var filePath in workspaceEdit.changes) {
            if (!workspaceEdit.changes.hasOwnProperty(filePath)) continue;
            if (files.has(filePath)) {
                var info = files.get(filePath);
                info.version++;
                ipc.emit('gopls-didChange', [{
                    file: filePath,
                    content: info.model.getValue(),
                    version: info.version
                }]);
            }
        }
    }
}

// ============================================================
// Section 3: FILE MANAGER - File open/close/save/reload logic
// ============================================================

function switchToFile(filePath) {
    var info = files.get(filePath);
    if (currentFilePath && files.has(currentFilePath)) {
        files.get(currentFilePath).viewState = EditorAdapter.saveViewState();
    }
    EditorAdapter.setModel(info.model);
    if (info.viewState) EditorAdapter.restoreViewState(info.viewState);
    EditorAdapter.updateOptions({readOnly: !!info.readOnly});
    currentFilePath = filePath;
}

function openFile(filePath, readOnly) {
    if (!editor) return;

    ipc.emit('open-file-request', [filePath], function (response) {
        if (!response) return;

        var data = JSON.parse(response);
        var content = data.content;
        var language = data.language;
        var modTime = data.modTime;

        if (files.has(filePath)) {
            var info = files.get(filePath);
            info.readOnly = readOnly;
            if (info.modTime !== modTime && !info.isDirty) {
                info.model.setValue(content);
                info.modTime = modTime;
                info.version++;
                ipc.emit('gopls-didChange', [{
                    file: filePath, content: content, version: info.version
                }]);
            }
        } else {
            var uri = EditorAdapter.uri(filePath);
            files.set(filePath, {
                model: EditorAdapter.createModel(content, language, uri),
                modTime: modTime, isDirty: false, viewState: null, readOnly: readOnly, version: 1
            });
            ipc.emit('register-opened-file', [{file: filePath, modTime: modTime}]);
            ipc.emit('gopls-didOpen', [{
                file: filePath, languageId: language, content: content, version: 1
            }]);
        }

        switchToFile(filePath);
    });
}

function closeFile(filePath) {
    if (!files.has(filePath)) return;
    var info = files.get(filePath);

    ipc.emit('gopls-didClose', [filePath]);
    EditorAdapter.disposeModel(info.model);
    files.delete(filePath);
    ipc.emit('unregister-opened-file', [filePath]);

    if (currentFilePath === filePath) {
        currentFilePath = '';
        if (files.size > 0) {
            var firstKey = files.keys().next().value;
            switchToFile(firstKey);
        } else {
            EditorAdapter.setModel(EditorAdapter.createModel('', 'plaintext'));
        }
    }
}

function autoSave() {
    if (!currentFilePath || !editor) return;
    var model = EditorAdapter.getActiveModel();
    if (!model) return;

    organizeImportsBeforeSave(currentFilePath, model);
}

function organizeImportsBeforeSave(filePath, model) {
    codeActionRequestID++;
    var reqID = codeActionRequestID;
    var kinds = 'source.organizeImports';
    var diags = currentDiagnostics.get(filePath) || [];
    var fullRange = EditorAdapter.getFullModelRange(model);

    pendingOrganizeSave = {filePath: filePath, reqID: reqID};

    ipc.emit('gopls-codeAction', [{
        requestID: reqID, file: filePath,
        startLine: fullRange.startLineNumber - 1, startChar: fullRange.startColumn - 1,
        endLine: fullRange.endLineNumber - 1, endChar: fullRange.endColumn - 1,
        kinds: kinds, diagnostics: diags
    }]);
}

// ============================================================
// Section 4: IPC INTERFACE - Inbound event listeners from Go
// ============================================================

ipc.on('open-file', function (data, readOnly) { openFile(data, readOnly); });
ipc.on('close-file', function (data) { closeFile(data); });
ipc.on('save-current-file', function () { autoSave(); });

ipc.on('file-changed-externally', function (filePath) {
    if (!files.has(filePath)) return;
    var info = files.get(filePath);
    if (info.isDirty) return;

    ipc.emit('reload-file-request', [filePath], function (response) {
        if (!response) return;
        var data = JSON.parse(response);
                applyingEdit = true;
        info.model.setValue(data.content);
        applyingEdit = false;
        info.modTime = data.modTime;
                info.version = 1;
        info.isDirty = false;
        if (currentFilePath === filePath) EditorAdapter.setModel(info.model);
        ipc.emit('gopls-didClose', [filePath]);
        ipc.emit('gopls-didOpen', [{
            file: filePath, languageId: data.language, content: data.content, version: 1
        }]);
                ipc.emit('set-file-dirty', [{file: filePath, isDirty: false}]);
        ipc.emit('register-opened-file', [{file: filePath, modTime: data.modTime}]);
        showNotification('文件已重新加载: ' + getFileName(filePath));
    });
});

ipc.on('file-conflict-detected', function (filePath) {
    if (!files.has(filePath)) return;

    ipc.emit('reload-file-request', [filePath], function (response) {
        if (!response) return;
        var data = JSON.parse(response);
        var info = files.get(filePath);
        applyingEdit = true;
        info.model.setValue(data.content);
        applyingEdit = false;
        info.modTime = data.modTime;
        info.version = 1;
        info.isDirty = false;
        if (currentFilePath === filePath) EditorAdapter.setModel(info.model);
        ipc.emit('gopls-didClose', [filePath]);
        ipc.emit('gopls-didOpen', [{
            file: filePath, languageId: data.language, content: data.content, version: 1
        }]);
        ipc.emit('set-file-dirty', [{file: filePath, isDirty: false}]);
        ipc.emit('register-opened-file', [{file: filePath, modTime: data.modTime}]);
    });
});
</script>
</body>
</html>
