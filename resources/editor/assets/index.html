<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Designer Code Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #container {
            flex: 1;
            min-height: 0;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #2d2d2d;
            color: #e0e0e0;
            border-left: 3px solid #4fc3f7;
            border-radius: 4px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>
<div id="container"></div>
<div id="toast" class="toast"></div>

<script src="./vs/loader.js"></script>
<script>
    let editor = null;
    let currentFilePath = '';
    let saveTimeout = null;
    const files = new Map(); // 存储: { model, modTime, isDirty, viewState }

    require.config({paths: {vs: './vs'}});
    require(['vs/editor/editor.main'], function (monaco) {
        editor = monaco.editor.create(document.getElementById('container'), {
            value: '',
            language: 'go',
            theme: 'vs-dark',
            fontSize: 14,
            automaticLayout: true,
            minimap: {enabled: true},
            scrollBeyondLastLine: false,
            renderWhitespace: 'selection',
            tabSize: 4,
            insertSpaces: true
        });

        editor.onDidChangeModelContent(() => {
            if (currentFilePath && files.has(currentFilePath)) {
                const info = files.get(currentFilePath);
                if (!info.isDirty) {
                    info.isDirty = true;
                    ipc.emit('set-file-dirty', [{file: currentFilePath, isDirty: true}]);
                }
            }
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(autoSave, 500);
        });

        ipc.emit("monaco-inited", []);
    });

    function autoSave() {
        if (!currentFilePath || !editor) return;
        const model = editor.getModel();
        if (!model) return;

        ipc.emit('save-file', [{file: currentFilePath, content: model.getValue()}], function (result) {
            if (result === 'ok' && files.has(currentFilePath)) {
                files.get(currentFilePath).isDirty = false;
            }
        });
    }

    function switchToFile(filePath) {
        const info = files.get(filePath);
        // 保存当前视图状态
        if (currentFilePath && files.has(currentFilePath)) {
            files.get(currentFilePath).viewState = editor.saveViewState();
        }
        // 切换并恢复视图状态
        editor.setModel(info.model);
        if (info.viewState) editor.restoreViewState(info.viewState);
        editor.updateOptions({readOnly: !!info.readOnly});
        currentFilePath = filePath;
    }

    function openFile(filePath, readOnly) {
        if (!editor) return;

        ipc.emit('open-file-request', [filePath], function (response) {
            if (!response) {
                console.error('打开文件失败:', filePath);
                return;
            }

            const {content, language, modTime} = JSON.parse(response);
            console.log("open-file-request:", {content: content.substring(0, 50) + '...', language, modTime});

            if (files.has(filePath)) {
                const info = files.get(filePath);
                info.readOnly = readOnly;
                if (info.modTime !== modTime && !info.isDirty) {
                    info.model.setValue(content);
                    info.modTime = modTime;
                }
            } else {
                const uri = monaco.Uri.parse('file:///' + filePath.replace(/\\/g, '/'));
                files.set(filePath, {
                    model: monaco.editor.createModel(content, language, uri),
                    modTime, isDirty: false, viewState: null, readOnly
                });
                ipc.emit('register-opened-file', [{file: filePath, modTime}]);
            }

            switchToFile(filePath);
        });
    }

    function closeFile(filePath) {
        if (!files.has(filePath)) return;
        const info = files.get(filePath);

        info.model.dispose();
        files.delete(filePath);
        ipc.emit('unregister-opened-file', [filePath]);

        if (currentFilePath === filePath) {
            currentFilePath = '';
            if (files.size > 0) {
                const firstKey = files.keys().next().value;
                switchToFile(firstKey);
            } else {
                editor.setModel(monaco.editor.createModel('', 'plaintext'));
            }
        }
    }

    ipc.on('open-file', (data, readOnly) => openFile(data, readOnly));
    ipc.on('close-file', data => closeFile(data));
    ipc.on('save-current-file', () => autoSave());

    ipc.on('file-changed-externally', filePath => {
        if (!files.has(filePath)) return;
        const info = files.get(filePath);
        if (info.isDirty) return;

        ipc.emit('reload-file-request', [filePath], function (response) {
            if (!response) return;
            const {content, modTime} = JSON.parse(response);
            info.model.setValue(content);
            info.modTime = modTime;
            if (currentFilePath === filePath) editor.setModel(info.model);
            showNotification('文件已重新加载: ' + getFileName(filePath));
        });
    });

    ipc.on('file-conflict-detected', filePath => {
        if (!files.has(filePath)) return;

        ipc.emit('reload-file-request', [filePath], function (response) {
            if (!response) return;
            const {content, modTime} = JSON.parse(response);
            const info = files.get(filePath);
            info.model.setValue(content);
            info.modTime = modTime;
            info.isDirty = false;
            if (currentFilePath === filePath) editor.setModel(info.model);
        });
    });

    function getFileName(filePath) {
        return filePath.replace(/\\/g, '/').split('/').pop();
    }

    function showNotification(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

</script>
</body>
</html>
